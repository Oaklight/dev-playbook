name: zerodep-update

on:
  schedule:
    - cron: "17 3 * * 1" # Weekly Monday 3:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head zerodep-update --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            echo "PR #$pr is already open — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.existing.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install zerodep CLI
        if: steps.existing.outputs.skip != 'true'
        run: pip install zerodep

      - name: Check for outdated modules
        if: steps.existing.outputs.skip != 'true'
        id: check
        run: |
          output=$(zerodep outdated --json)
          echo "$output"
          count=$(echo "$output" | python3 -c "import sys,json; print(json.load(sys.stdin)['outdated_count'])")
          if [ "$count" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            modules=$(echo "$output" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for m in d['modules']:
              if m['status'] != 'up-to-date':
                  print(f\"- {m['name']}: {m['local_version']} → {m['latest_version']} ({m['status']})\")
          ")
            echo "modules<<EOF" >> "$GITHUB_OUTPUT"
            echo "$modules" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Update outdated modules
        if: steps.check.outputs.has_updates == 'true'
        run: zerodep update --all

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: zerodep-update
          title: "chore(deps): update vendored zerodep modules"
          body: |
            Automated update of vendored zerodep modules.

            ${{ steps.check.outputs.modules }}
          labels: dependencies,zerodep
          commit-message: "chore(deps): update vendored zerodep modules"
